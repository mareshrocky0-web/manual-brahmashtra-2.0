name: Maha-Brahmashtra Manual 2.0 Global Security Pipeline

on: [push, pull_request]

jobs:
  ultimate-manual-hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      
      - name: Install Correct Solidity Compiler Version
        run: |
          pip install solc-select || true
          solc-select install 0.7.4 || true
          solc-select use 0.7.4 || true
        continue-on-error: true

     
      - name: Run Slither Security Scan
        uses: crytic/slither-action@main
        with:
          target: '.'
          ignore-compile: true
        continue-on-error: true

     
      - name: Run Aderyn Advanced Scan
        run: |
          pip install aderyn || cargo install aderyn || true
          aderyn . || true
        continue-on-error: true

      
      - name: Export Custom Vulnerability Report
        run: |
          echo "# Brahmashtra 2.0 Core Security Audit Report" > report.md
          echo "Automated scans completed on Target Contracts." >> report.md
